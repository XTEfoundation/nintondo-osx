name: TestFlight

# Signed Release archive of the iOS app (io.nintondo.osx, iPhone + iPad), exported as an
# App Store .ipa and uploaded to TestFlight. Upload happens only on a manual run
# (Actions -> TestFlight -> Run workflow) with upload=true; pushes to the PR branch archive only.
#
# Needs the repository secrets IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD,
# IOS_PROFILE_BASE64, ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID.
#
# IOS_PROFILE_BASE64 is an "App Store Connect" distribution profile for io.nintondo.osx
# (with the Push Notifications capability, because BlueWalletRelease.entitlements sets
# aps-environment). The app target also embeds the Stickers and Widgets extensions and depends on
# the watch app, each with its own bundle ID / profile. With `strip_extensions` (default) the
# workflow removes them from the app target for this CI archive only, so one profile is enough.

on:
  # workflow_dispatch only works once this file is on the default branch. Until then a push to the
  # PR branch runs a build/archive-only check (never uploads, see the upload step's condition).
  push:
    branches: [ipad-support-build-fix]
    paths: ['.github/workflows/testflight.yml', 'ios/**', 'package.json', 'yarn.lock']
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner image
        default: macos-15-intel
      xcode:
        description: Xcode version prefix to use (newest match wins)
        default: "26"
      strip_extensions:
        description: Build without Stickers / Widgets / Watch (only one provisioning profile needed)
        type: boolean
        default: true
      upload:
        description: Upload the .ipa to TestFlight
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 120
    env:
      BUNDLE_ID: io.nintondo.osx
    steps:
      - uses: actions/checkout@v4

      - name: Build number
        # Must increase per upload; the project already uses 1775393121 (timestamp style).
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 1775400000 ))" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_${{ inputs.xcode || '26' }}*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XCODE" || { echo "::error::No Xcode ${{ inputs.xcode }} on this runner"; exit 1; }
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR=$XCODE/Contents/Developer xcodebuild -version
          DEVELOPER_DIR=$XCODE/Contents/Developer xcodebuild -showsdks | grep -i iphoneos

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.6
          bundler-cache: true

      - name: pod install
        working-directory: ios
        run: bundle exec pod install

      - name: Install signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          echo "Profile: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist") ($UUID)"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$UUID.mobileprovision"
          done
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Manual signing for the app target
        working-directory: ios
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          STRIP_EXTENSIONS: ${{ github.event_name != 'workflow_dispatch' || inputs.strip_extensions }}
        run: |
          # Only the BlueWallet (Nintondo OSX) app target is signed manually; pods keep their settings.
          bundle exec ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("BlueWallet.xcodeproj")
            target = project.targets.find { |t| t.name == "BlueWallet" }
            if ENV["STRIP_EXTENSIONS"] == "true"
              # CI-only: drop embedded extensions / watch app so a single profile signs the archive.
              target.dependencies.dup.each { |d| target.dependencies.delete(d); d.remove_from_project }
              target.copy_files_build_phases.each do |phase|
                phase.files.dup.each { |f| puts "Not embedding #{f.display_name}"; phase.remove_build_file(f) }
              end
            end
            target.build_configurations.each do |config|
              next unless config.name == "Release"
              s = config.build_settings
              s["CODE_SIGN_STYLE"] = "Manual"
              s["DEVELOPMENT_TEAM"] = ENV["TEAM_ID"]
              s["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              s["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
              s["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_UUID"]
              s["PROVISIONING_PROFILE"] = ENV["PROFILE_UUID"]
            end
            project.save
          '

      - name: Archive (Release, generic iOS device)
        working-directory: ios
        run: |
          # Report every compile error in one run instead of stopping at the first.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          set +e
          xcodebuild \
            -workspace BlueWallet.xcworkspace \
            -scheme BlueWallet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NintondoOSX.xcarchive" \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive > xcodebuild-archive.log 2>&1
          status=$?
          grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" xcodebuild-archive.log | head -100
          if [ "$status" -ne 0 ]; then tail -200 xcodebuild-archive.log; fi
          exit "$status"

      - name: Export .ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NintondoOSX.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa)
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          unzip -o -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' -c 'Print :DTSDKName' -c 'Print :DTXcode' -c 'Print :UIDeviceFamily' "$APP/Info.plist"
          test -f "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier"

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            ios/Podfile.lock
            ios/xcodebuild-archive.log
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf ~/.appstoreconnect/private_keys "$RUNNER_TEMP"/profile.* "$RUNNER_TEMP/ExportOptions.plist"
